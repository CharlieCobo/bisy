<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Bisy · Volviendo a tu app…</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;color:#333}a{color:#2a78d6}</style>
</head>
<body>
<p id="msg">Volviendo a Bisy…</p>
<script>
  // El banco vuelve aquí (Enable Banking exige https). Reenviamos los parámetros a tu Bisy local.
  // El destino viaja en "state" como "<uuid>~<base64(origen)>" y solo se aceptan orígenes localhost.
  (function () {
    var params = new URLSearchParams(location.search);
    var state = params.get('state') || '';
    var origin = 'http://localhost:5173';
    var part = state.split('~')[1];
    if (part) {
      try {
        var decoded = atob(part);
        if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(decoded)) origin = decoded;
      } catch (e) {}
    }
    var target = origin + '/bancos/callback?' + params.toString();
    document.getElementById('msg').innerHTML = 'Volviendo a Bisy… Si no pasa nada, <a href="' + target.replace(/"/g, '&quot;') + '">pulsa aquí</a>.';
    location.replace(target);
  })();
</script>
</body>
</html>
